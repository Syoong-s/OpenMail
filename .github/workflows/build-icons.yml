name: Check Linux SVG build support

on:
  pull_request:
    paths:
      - '.github/workflows/build-icons.yml'
      - '.github/workflows/release.yml'
      - 'tools/build_windows.py'
      - 'tests/test_build_icons.py'
      - 'maildesk/desktop_assets/icon.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install explicit SVG decoder dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdk-pixbuf-2.0-0 librsvg2-common
      - name: Verify icon rendering without a Windows SDK
        run: python tools/build_windows.py --check-icon
      - name: Verify native rendering and loader failure diagnostics
        run: python -m unittest tests.test_build_icons -v
